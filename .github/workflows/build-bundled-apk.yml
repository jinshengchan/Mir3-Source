name: Build bundled Android APK

on:
  push:
    branches: [codex/bundled-apk-delivery, codex/resource-fixes-testing-20261007]
    paths-ignore:
      - tools/inspect-apk-protocol.py
      - .github/workflows/inspect-original-protocol.yml
      - tools/inspect-resource-package.py
      - .github/workflows/inspect-resource-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[resource-inspection]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BUNDLE_DIR: ${{ github.workspace }}/.build/bundled-assets
    steps:
      - uses: actions/checkout@v4
      - name: Report failing build commands
        run: |
          cat > "$RUNNER_TEMP/mir3-build-errors.sh" <<'SH'
          trap 'printf "::error title=Build command failed::Line %s: %s\n" "$LINENO" "$BASH_COMMAND"' ERR
          SH
          echo "BASH_ENV=$RUNNER_TEMP/mir3-build-errors.sh" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.401'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: |
          sudo dotnet workload install android --skip-manifest-update
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test resource installer and account request gate
        run: dotnet run --project tests/BundledResources.Tests/BundledResources.Tests.csproj
      - name: Test zero-frame title and effect animation
        run: dotnet run --project tests/MirEffects.Tests/MirEffects.Tests.csproj
      - name: Test Android background heartbeat transport
        run: dotnet run --project tests/BackgroundConnection.Tests/BackgroundConnection.Tests.csproj
      - name: Get replacement resources and APK startup assets
        run: |
          python3 -m pip install 'gdown==5.2.0' 'dnfile==0.18.0' 'lz4==4.4.5'
          mkdir -p .build
          gdown 'https://drive.google.com/uc?id=1Fts3QP26o2YbJ08Pb99GNv6QiHv86D8S' -O .build/sample.apk
          python3 - <<'PY'
          import pathlib, zipfile
          source = pathlib.Path('.build/sample.apk')
          with zipfile.ZipFile(source) as apk:
              pathlib.Path('.build/bootstrap.zip').write_bytes(apk.read('assets/Data.zip'))
          source.unlink()
          PY
          gdown 'https://drive.google.com/uc?id=11hocChF478kUzQB45F8jrcLIWAVKRC4X' -O .build/replacement.archive
          python3 - <<'PY'
          import os, pathlib, runpy
          scope = runpy.run_path('tools/inspect-resource-package.py')
          try:
              scope['prepare'](pathlib.Path('.build/replacement.archive'), pathlib.Path('.build/bootstrap.zip'), pathlib.Path('.'), pathlib.Path('.build/resource-inspection'), pathlib.Path(os.environ['BUNDLE_DIR']))
          except Exception as error:
              print('::error title=Replacement bundle rejected::' + str(error).replace('\n', '%0A'))
              raise
          PY
          cat .build/resource-inspection/combined-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compile repository server and verify its actual protocol
        run: |
          if ! dotnet build ServerLibrary/ServerLibrary.csproj -c Release -p:CopyLocalLockFileAssemblies=true > .build/server-build.log 2>&1; then
            python3 - <<'PY'
          import pathlib
          for line in pathlib.Path('.build/server-build.log').read_text().splitlines():
              if 'error ' in line:
                  print('::error title=Repository server build::' + line[:1500])
          PY
            exit 1
          fi
          python3 tools/generate-repository-protocol.py ServerLibrary/bin/Release/netstandard2.0/Library.dll \
            --report .build/REPOSITORY-PROTOCOL.json --order Mir3.Mobile/RepositoryServerPacketOrder.cs --check
          python3 tools/verify-runtime-packet-order.py .build/REPOSITORY-PROTOCOL.json --repository \
            --server-assembly ServerLibrary/bin/Release/netstandard2.0/Library.dll
      - name: Verify actual source resource checksums
        run: python3 tools/verify-bundled-resources.py "$BUNDLE_DIR"
      - name: Test resource header recovery against real bundled metadata
        run: dotnet run --project tests/ResourceHeaders.Tests/ResourceHeaders.Tests.csproj -- "$BUNDLE_DIR"
      - name: Set test APK version
        run: |
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          path = 'Mir3.Droid/AndroidManifest.xml'
          tree = ET.parse(path)
          tree.getroot().set('{http://schemas.android.com/apk/res/android}versionCode', '1')
          tree.getroot().set('{http://schemas.android.com/apk/res/android}versionName', '1.0.0')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PYCODE
      - name: Build arm64 test APK
        run: |
          bash tools/build-bundled-apk.sh "$BUNDLE_DIR" \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:RuntimeIdentifier=android-arm64 \
            -p:BundledResourceTestBuild=true \
            -p:RepositoryServerProtocol=true \
            -p:RunAOTCompilation=False -p:AotAssemblies=False \
            -p:AndroidEnableProfiledAot=False -p:PublishTrimmed=False
      - name: Verify package and signature
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path('Mir3.Droid/bin/Release/net8.0-android/android-arm64/com.xj.Mir3.Droid-Signed.apk')
          with zipfile.ZipFile(apk) as package:
              assets = [i for i in package.infolist() if i.filename == 'assets/Data.zip' or i.filename.startswith('assets/LocalUpdate/')]
              source = pathlib.Path(__import__('os').environ['BUNDLE_DIR'])
              expected = ['assets/' + str(p.relative_to(source)).replace('\\', '/') for p in source.rglob('*') if p.is_file()]
              assert sorted(i.filename for i in assets) == sorted(expected)
              print('Verified replacement resource assets:', len(assets))
              assert not any(i.filename.endswith(('.partial', '.tmp')) for i in package.infolist())
              assert package.testzip() is None
          print('Verified APK size:', apk.stat().st_size)
          PY
          python3 tools/verify-bundled-resources.py "$BUNDLE_DIR" \
            --apk Mir3.Droid/bin/Release/net8.0-android/android-arm64/com.xj.Mir3.Droid-Signed.apk \
            --report .build/BUNDLED-INTEGRITY.json
          python3 tools/inspect-apk-protocol.py \
            Mir3.Droid/bin/Release/net8.0-android/android-arm64/com.xj.Mir3.Droid-Signed.apk \
            --output .build/APK-PROTOCOL.json --compare .build/REPOSITORY-PROTOCOL.json
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose Mir3.Droid/bin/Release/net8.0-android/android-arm64/com.xj.Mir3.Droid-Signed.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging Mir3.Droid/bin/Release/net8.0-android/android-arm64/com.xj.Mir3.Droid-Signed.apk > .build/APK-METADATA.txt
          python3 - <<'PY'
          import pathlib
          metadata = pathlib.Path('.build/APK-METADATA.txt').read_text()
          assert "versionCode='1'" in metadata and "versionName='1.0.0'" in metadata
          PY
          sha256sum Mir3.Droid/bin/Release/net8.0-android/android-arm64/com.xj.Mir3.Droid-Signed.apk > .build/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mir3-bundled-arm64-test-apk
          path: |
            Mir3.Droid/bin/Release/net8.0-android/android-arm64/com.xj.Mir3.Droid-Signed.apk
            .build/APK-SHA256.txt
            .build/APK-METADATA.txt
            .build/BUNDLED-INTEGRITY.json
            .build/resource-inspection/combined-report.json
            .build/resource-inspection/combined-report.md
            .build/REPOSITORY-PROTOCOL.json
            .build/APK-PROTOCOL.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
