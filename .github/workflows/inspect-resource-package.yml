name: Inspect replacement resource package
on:
  push:
    branches: [codex/resource-fixes-testing-20261007]
    paths:
      - tools/inspect-resource-package.py
      - .github/workflows/inspect-resource-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download authorized replacement resources
        run: |
          python3 -m pip install 'gdown==5.2.0'
          mkdir -p .build
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['gdown', 'https://drive.google.com/uc?id=11hocChF478kUzQB45F8jrcLIWAVKRC4X', '-O', '.build/resources.archive'], capture_output=True, text=True)
          if result.returncode:
              message = (result.stderr or result.stdout)[-2500:].replace('\n', '%0A').replace('\r', '')
              print('::error title=Resource download failed::' + message)
              raise SystemExit(result.returncode)
          print(result.stderr[-500:])
          PY
      - name: Check archive integrity and source resource catalog
        run: |
          python3 - <<'PY'
          import pathlib, runpy
          scope = runpy.run_path('tools/inspect-resource-package.py')
          try:
              scope['inspect_update'](pathlib.Path('.build/resources.archive'), pathlib.Path('.'), pathlib.Path('.build/resource-inspection'))
          except Exception as error:
              print('::error title=Resource inspection failed::' + str(error).replace('\n', '%0A'))
              raise
          PY
          cat .build/resource-inspection/combined-report.md >> "$GITHUB_STEP_SUMMARY"
          if test -f .build/resource-inspection/base/resource-report.md; then
            cat .build/resource-inspection/base/resource-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: replacement-resource-inspection
          path: |
            .build/resource-inspection/**/*.json
            .build/resource-inspection/**/*.md
          retention-days: 3
